name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PDF-Tool-Lite-Windows.exe
            asset_path: dist/PDF-Tool-Lite-Windows.exe
          - os: ubuntu-latest
            artifact_name: PDF-Tool-Lite-Linux-x86_64.AppImage
            asset_path: |
              dist/PDF-Tool-Lite-Linux
              dist/PDF-Tool-Lite-Linux-x86_64.AppImage
          - os: macos-latest
            artifact_name: PDF-Tool-Lite-macOS.zip
            asset_path: dist/PDF-Tool-Lite-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 wget file fuse libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Build Windows
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --paths . --name "PDF-Tool-Lite-Windows" src/main.py

      # Build Linux
      - name: Build Linux Binary & AppImage
        if: runner.os == 'Linux'
        run: |
          # 1. Standalone Binary derle
          pyinstaller --noconfirm --onefile --windowed --paths . --name "PDF-Tool-Lite-Linux" src/main.py
          chmod +x dist/PDF-Tool-Lite-Linux

          # 2. AppImage Paketle
          mkdir -p AppDir/usr/bin
          cp dist/PDF-Tool-Lite-Linux AppDir/usr/bin/pdf-tool-lite
          
          # Desktop Entry
          cat <<EOF > AppDir/pdf-tool-lite.desktop
          [Desktop Entry]
          Name=PDF Tool Lite
          Exec=pdf-tool-lite
          Icon=pdf-tool-lite
          Type=Application
          Categories=Utility;Office;
          EOF
          
          # İkon kopyala
          cp assets/icon.png AppDir/pdf-tool-lite.png
          cp assets/icon.png AppDir/.DirIcon
          
          # AppRun script
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/pdf-tool-lite" "\$@"
          EOF
          chmod +x AppDir/AppRun
          
          # appimagetool indir ve çalıştır
          wget -q -c https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/PDF-Tool-Lite-Linux-x86_64.AppImage

      # Build macOS
      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed --paths . --name "PDF-Tool-Lite" src/main.py
          cd dist && zip -r PDF-Tool-Lite-macOS.zip PDF-Tool-Lite.app

      # Publish Assets to GitHub Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
