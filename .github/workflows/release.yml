name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: PDF-Tool-Lite-Linux
            executable: pdf-tool-lite
          - os: windows-latest
            artifact_name: PDF-Tool-Lite-Windows.exe
            executable: pdf-tool-lite.exe
          - os: macos-latest
            artifact_name: PDF-Tool-Lite-macOS
            executable: pdf-tool-lite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 wget file fuse libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.executable }}" "src/main.py"

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "${{ matrix.executable }}" "src/main.py"
          cd dist
          zip -r PDF-Tool-Lite-macOS.zip "${{ matrix.executable }}.app"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/pdf-tool-lite AppDir/usr/bin/
          
          # Create Desktop Entry
          cat <<EOF > AppDir/pdf-tool-lite.desktop
          [Desktop Entry]
          Name=PDF Tool Lite
          Exec=pdf-tool-lite
          Icon=pdf-tool-lite
          Type=Application
          Categories=Utility;Office;
          EOF
          
          # Create Dummy Icon
          touch AppDir/pdf-tool-lite.png
          
          # Create AppRun script
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/pdf-tool-lite" "\$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Download appimagetool and build
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir PDF-Tool-Lite-Linux-x86_64.AppImage

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.executable }}*
            PDF-Tool-Lite-Linux-x86_64.AppImage
            dist/PDF-Tool-Lite-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
